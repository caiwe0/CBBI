name: CBBI auto

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python
        run: python --version

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (use system python)
        run: uv sync --python $(which python)

      - name: Generate cbbi.json
        run: uv run python publish_cbbi.py

      - name: Commit and push
        run: |
          git config user.name "cbbi-bot"
          git config user.email "cbbi-bot@users.noreply.github.com"
          git add cbbi.json
          git diff --cached --quiet || git commit -m "auto update cbbi.json"
          git push
