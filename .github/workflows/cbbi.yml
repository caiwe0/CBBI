name: CBBI auto
on:
  schedule:
    - cron: "0 */2 * * *"   # UTC 每2小时
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: python publish_cbbi.py
      - run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "cbbi-bot"
          git add cbbi.json
          git diff --cached --quiet || git commit -m "auto cbbi"
          git push
