name: CBBI auto

on:
  schedule:
    - cron: "0 */2 * * *"      # UTC 每 2 小时
  workflow_dispatch:            # 支持手动运行

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Ensure Python 3.13 for uv
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Generate cbbi.json
        run: uv run python publish_cbbi.py

      - name: Commit and push
        run: |
          git config user.name "cbbi-bot"
          git config user.email "cbbi-bot@users.noreply.github.com"
          git add cbbi.json
          git diff --cached --quiet || git commit -m "auto update cbbi.json"
          git push
