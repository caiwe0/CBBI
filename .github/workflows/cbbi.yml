name: CBBI auto

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/python-version: "3.13"
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: - run: uv python install 3.13 uv sync

      - name: Generate cbbi.json
        run: uv run python publish_cbbi.py

      - name: Commit and push
        run: |
          git config user.name "cbbi-bot"
          git config user.email "cbbi-bot@users.noreply.github.com"
          git add cbbi.json
          git diff --cached --quiet || git commit -m "auto update cbbi.json"
          git push
